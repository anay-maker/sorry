<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Sorry Betu ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #1a0b2e 0%, #2d1b4e 40%, #4a1942 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #f0e6ff;
      position: relative;
    }

    /* Floating hearts */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      opacity: 0.35;
      animation: float 14s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 120, 180, 0.4));
    }

    @keyframes float {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.4; }
      85% { opacity: 0.4; }
      100% {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* ========== SLIDE SYSTEM ========== */
    .slider {
      position: relative;
      width: 92%;
      max-width: 440px;
      height: 580px;
      overflow: hidden;
      z-index: 10;
    }

    .slides {
      display: flex;
      width: 400%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide {
      width: 25%;
      height: 100%;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(30, 15, 50, 0.8);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      height: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(200, 80, 160, 0.15);
      border: 1px solid rgba(255, 150, 200, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* Common styles */
    .emoji {
      font-size: 64px;
      margin-bottom: 16px;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff8ec4, #e0aaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: #c9a0d8;
      margin-bottom: 30px;
    }

    /* Typewriter */
    .message-box {
      background: rgba(50, 25, 70, 0.6);
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 140, 190, 0.18);
      text-align: left;
      min-height: 160px;
      line-height: 1.65;
      font-size: 15px;
      color: #f5e9ff;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #ff8ec4;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Forgiveness Meter */
    .meter-section {
      margin-bottom: 28px;
    }

    .meter-label {
      font-size: 14px;
      color: #d4a5e8;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .meter-track {
      height: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
    }

    .meter-fill {
      height: 100%;
      width: 12%;
      background: linear-gradient(90deg, #ff6b9d, #c44569, #ff8ec4);
      border-radius: 20px;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 12px rgba(255, 107, 157, 0.6);
    }

    .meter-percent {
      font-size: 13px;
      color: #ffb3d1;
      margin-top: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 22px rgba(196, 69, 105, 0.4);
      margin: 6px 4px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(196, 69, 105, 0.55);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: default;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1.5px solid rgba(255, 150, 200, 0.4);
      color: #ffb3d1;
      box-shadow: none;
    }

    /* Navigation dots */
    .dots {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 150, 200, 0.3);
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot.active {
      background: #ff8ec4;
      transform: scale(1.3);
    }

    /* Final page */
    .big-heart {
      font-size: 80px;
      margin: 10px 0;
      animation: heartbeat 1.3s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.18); }
      50% { transform: scale(1); }
      75% { transform: scale(1.1); }
    }

    .final-text {
      font-size: 18px;
      font-weight: 600;
      color: #ffb3d1;
      margin-top: 12px;
      line-height: 1.5;
    }

    .music-box {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      color: #c9a0d8;
    }

    .music-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #9b7aad;
    }

    @media (max-width: 480px) {
      .slider { height: 560px; }
      .card { padding: 28px 18px; }
      h1 { font-size: 22px; }
      .emoji { font-size: 52px; }
    }
  </style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <div class="slider">
    <div class="slides" id="slides">

      <!-- ========== PAGE 1 : Intro ========== -->
      <div class="slide">
        <div class="card">
          <div class="emoji">🥺💔</div>
          <h1>I'm Really Sorry Betu...</h1>
          <p class="subtitle">kal raat ke liye... ❤️</p>
          <button class="btn" onclick="goToPage(1)">Next →</button>
          <div class="footer">Made with ❤️ only for you</div>
        </div>
      </div>

      <!-- ========== PAGE 2 : Typewriter Message ========== -->
      <div class="slide">
        <div class="card">
          <div class="message-box">
            <span id="typewriter"></span><span class="cursor" id="cursor"></span>
          </div>
          <button class="btn" onclick="goToPage(2)">Next →</button>
          <button class="btn btn-secondary" onclick="goToPage(0)">← Back</button>
        </div>
      </div>

      <!-- ========== PAGE 3 : Forgiveness Meter ========== -->
      <div class="slide">
        <div class="card">
          <div class="meter-section">
            <div class="meter-label">
              <span>Forgiveness Meter</span>
              <span id="meterPercent">12%</span>
            </div>
            <div class="meter-track">
              <div class="meter-fill" id="meterFill"></div>
            </div>
            <div class="meter-percent">Thoda sa hope hai... please fill it 💕</div>
          </div>

          <button class="btn" id="forgiveBtn" onclick="forgiveMe()">Will you forgive me? 💕</button>
          <button class="btn btn-secondary" id="moreBtn" onclick="addMore()" style="display:none;">Thoda aur hope do 🥺</button>
          <br>
          <button class="btn btn-secondary" onclick="goToPage(1)" style="margin-top:12px;">← Back</button>
        </div>
      </div>

      <!-- ========== PAGE 4 : Final Surprise ========== -->
      <div class="slide">
        <div class="card">
          <div class="big-heart">💖</div>
          <p class="final-text">
            Thank you Betu...<br>
            Main wapas aisa kabhi nahi bolunga.<br>
            I really love you.
          </p>

          <div class="music-box">
            <button class="music-btn" id="musicBtn" onclick="toggleMusic()">▶</button>
            <span id="musicText">Play soft song</span>
          </div>

          <div class="footer">Forever yours ❤️</div>
        </div>
      </div>

    </div>

    <!-- Navigation Dots -->
    <div class="dots">
      <div class="dot active" onclick="goToPage(0)"></div>
      <div class="dot" onclick="goToPage(1)"></div>
      <div class="dot" onclick="goToPage(2)"></div>
      <div class="dot" onclick="goToPage(3)"></div>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ========== SLIDE SYSTEM ==========
    let currentPage = 0;
    const totalPages = 4;
    const slides = document.getElementById('slides');
    const dots = document.querySelectorAll('.dot');

    function goToPage(page) {
      currentPage = page;
      slides.style.transform = `translateX(-${page * 25}%)`;
      
      // Update dots
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === page);
      });

      // Start typewriter only when reaching page 2
      if (page === 1 && !window.typewriterStarted) {
        window.typewriterStarted = true;
        setTimeout(typeWriter, 400);
      }
    }

    // ========== Typewriter ==========
    const fullMessage = `Hey Betu,\n\nKal raat ke liye
